[project]
name = "cutroom"
version = "0.5.0"
description = "Cutroom: a video editor with no buttons that Claude drives: timelines as JSON, HDR-correct renders, graphics, Shorts, checks."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy", "opencv-python-headless", "pillow", "soundfile", "scipy", "librosa>=0.11,<1", "opentimelineio", "mcp",
  "mediapipe", "torch", "torchvision", "transformers", "timm", "open_clip_torch", "onnxruntime", "huggingface_hub",
]

[project.optional-dependencies]
masks = ["sam-2 @ git+https://github.com/facebookresearch/sam2.git"]

[project.scripts]
cutroom = "studio.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio"]
